### **The {{ app_name }} AI Testing Configuration**
###
### - The config is merged into the app config.
---

ai:
  ### during tests the file tools work below the test scratch directory, so
  ### test runs never touch the regular tmp files
  tools:
    read_file:
      options:
        base_dir: tmp/tests
    append_file:
      options:
        base_dir: tmp/tests
        file: notes.txt
