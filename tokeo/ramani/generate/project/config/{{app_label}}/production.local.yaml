### **The {{ app_name }} Production Configuration Secrets**
###
### - The secrets are merged into the app config.
### - This file should not be checked into source repos.
---



{% if feature_dramatiq == "Y" %}
dramatiq:
  ### connection options of rabbitmq
  rabbitmq:
    ### connection url to rabbitmq server
    url: amqp://localhost:5672/
    ### connection username or identity for rabbitmq server
    auth_identity: guest
    ### connection password for rabbitmq server
    auth_password: !vault:plain guest



{% endif -%}



smtp:
  ### enable authentication for service
  auth: true
  ### auth username or identity
  auth_identity: production.user
  ### auth password; replace it, or encrypt it with "{{ app_label }} vault encrypt"
  auth_password: !vault:plain top.secret



