### **The {{ app_name }} Main Configuration**
###
### The tokeo.ext.appenv module handles the configuration loading and overriding mechanism for
### Tokeo and derivated applications. Each configuration file is based on YAML files with a
### hierarchical structure that supports environment-specific config and local overrides.
###
### ### Configuration File Hierarchy:
###
### The configuration is loaded in the following order, with each file overriding
### the config of the previous ones:
###
### 1. Base configuration: ```config/{{ app_label }}/base.yaml```, then ```config/{{ app_label }}/base.d/*.yaml```
### 1. Environment configuration: ```config/{{ app_label }}/[environment].yaml```, then
###    ```config/{{ app_label }}/[environment].d/*.yaml```
### 1. Local configuration: ```[environment].local.yaml``` and the ```*.local.yaml``` of
###    ```[environment].d```, never for base
###
### Where ```[environment]``` can be one of:
###
### - ```development``` - Used during development
### - ```testing``` - Used for testing environments
### - ```staging``` - Used for staging environments
### - ```production``` - Used in production deployments
###
### ### Overloading Configuration:
###
### The overloading mechanism allows for partial config to be defined in environment-specific
### or local configuration files. Only the specified keys will be overridden, while all other
### keys will be inherited from the base configuration.
###
### Example:
###
### - base.yaml defines ```smtp.host: localhost```
### - production.yaml defines ```smtp.host: production.host.domain```
### - When running in production mode, ```smtp.host``` will be ```production.host.domain```
### - All other smtp keys from base.yaml remain unchanged
###
### ### Extende Local Configuration Files:
###
### Local configuration files (ending with ```.local.yaml```) are used for environment-specific
### secrets and config that should not be checked into source control. These files should
### be left added to ```.gitignore```.
---



### ### Core Application Configuration
###
### Main {{ app_name }} application config including debugging, plugins, and template locations
{{ app_label }}:
  ### Toggle application level debug (does not toggle framework debugging)
  # debug: false
  ### Where external (third-party) plugins are loaded from
  # plugin_dir: /var/lib/{{ app_label }}/plugins/
  ### Where all plugin configurations are loaded from
  # plugin_config_dir: /etc/{{ app_label }}/plugins.d/
  ### Where external templates are loaded from
  # template_dir: /var/lib/{{ app_label }}/templates/
