### **The {{ app_name }} AI Configuration**
###
### - The config is merged into the app config.
---



### ### Fundi AI configuration
###
### Config for the tools, guards, transformers, conductors, sandboxes,
### agents, profiles etc. For the full ai config reference see CONFIG.md of
### tokeo-fundi (module ```tokeo.core.ai.config```)
ai:
  ### tokeo-fundi is source-available, not open source
  ### read LICENSE.md of tokeo-fundi first and set true to prevent notice
  license_acknowledged: false

  ### app-wide loop limits (nearest wins: call arg > agent option > this base)
  # max_steps: 0            # max tool rounds per request (0 = unlimited)
  # max_loops: 3            # consecutive rounds without a successful call
  # trace: true             # record the step history (result.trace)

  ### selection when a command names none ("profile" = model, "agent" = tools)
  defaults:
    profile: mock
    agent: audited

  ### the toolset. an item is "type" (+ "options"); a list value is a group a
  ### profile/agent can activate by name
  tools:
    calc:
      type: {{ app_label }}.core.ai.tools.calc:TokeoAiCalcTool
    ### always answers 42; its description marks the result authoritative
    answer42:
      type: {{ app_label }}.core.ai.tools.calc42:TokeoAiAnswer42Tool
    current:
      type: {{ app_label }}.core.ai.tools.current:TokeoAiCurrentTool
    ### reads text files strictly below base_dir
    read_file:
      type: {{ app_label }}.core.ai.tools.read_file:TokeoAiReadFileTool
      options:
        base_dir: tmp
    ### the writing tool, denied by the "readonly" policy guard below
    append_file:
      type: {{ app_label }}.core.ai.tools.append_file:TokeoAiAppendFileTool
      options:
        base_dir: tmp
        file: notes.txt
    mathematics:
      - calc
    ### calendar tools with strict iso dates
    date_daydiff:
      type: {{ app_label }}.core.ai.tools.date_daydiff:TokeoAiDateDayDiffTool
    add_days:
      type: {{ app_label }}.core.ai.tools.add_days:TokeoAiAddDaysTool
    add_months:
      type: {{ app_label }}.core.ai.tools.add_months:TokeoAiAddMonthsTool
    add_years:
      type: {{ app_label }}.core.ai.tools.add_years:TokeoAiAddYearsTool
    weekday:
      type: {{ app_label }}.core.ai.tools.weekday:TokeoAiWeekdayTool
    week_number:
      type: {{ app_label }}.core.ai.tools.week_number:TokeoAiWeekNumberTool
    moon_phase:
      type: {{ app_label }}.core.ai.tools.moon_phase:TokeoAiMoonPhaseTool
    filesystem:
      - read_file
      - append_file
    calendar:
      - current
      - date_daydiff
      - add_days
      - add_months
      - add_years
      - weekday
      - week_number
      - moon_phase
    ### searches the knowledge files (docs/knowledge) by BM25, with sources
    search_docs:
      type: {{ app_label }}.core.ai.tools.search_docs:TokeoAiSearchDocsTool
      options:
        base_dir: docs/knowledge
    knowledge:
      - search_docs
    ### runs model-generated python: danger, only safe behind the wasm sandbox
    coding:
      type: tokeo.core.ai.tools:TokeoAiPythonUntrustedExecTool

  ### guards check a call and may deny it (deny-and-continue). an item: "type"
  ### is a built-in alias or a class path (module:Class), options under "options"
  guards:
    ### checks call arguments against the tool's parameters schema
    tool_schema_validate:
      type: tool_schema_validate
    ### allow/deny tool calls by name (deny wins); here: read yes, write no
    readonly:
      type: tool_policy
      options:
        deny:
          - append_file
    ### asks a person to confirm the decision before append_file (ai ask / ai chat
    ### in a terminal); the readonly no stays a no, notes are recorded
    ask_write:
      type: confirm
      options:
        tools: [append_file]
        # max_retries: 5       # no_retry runs a stage again at most so often
    ### denies a call whose arguments contain a word; a confirm note
    ### "deny: word, ..." adds words (project example, core/ai/guards/words.py)
    words:
      type: {{ app_label }}.core.ai.guards.words:{{ app_class_name }}AiWordFilterGuard
      options:
        words: [password]
    ### logs every step at every stage, denies nothing. the short form: a
    ### string is the type of an item without options
    trace_audit: trace_audit
    ### masks secret-looking spans at the tool stages; "patterns" is required
    regex_redact:
      type: regex_redact
      options:
        patterns:
          - '(?i)\bbearer\s+[A-Za-z0-9._\-]{8,}'
          - '\bsk-[A-Za-z0-9]{16,}\b'
          - '\bAKIA[0-9A-Z]{16}\b'
          - '(?i)\b(?:api[_-]?key|secret|password|token)\b\s*[:=]\s*\S+'
  ### transformers reshape (mask, rewrite, enrich) but never deny. same item
  ### form as guards; the core ships no built-in type, so "type" is a class path
  transformers:
    ### cuts over-long text (project example, core/ai/transformers/truncate.py)
    truncate:
      type: {{ app_label }}.core.ai.transformers.truncate:{{ app_class_name }}AiTruncateTransformer
      options:
        max_chars: 500
    ### puts today's date in front of the prompt (project example of the
    ### input pipeline at on_prompt, core/ai/transformers/today.py)
    today_prompt:
      type: {{ app_label }}.core.ai.transformers.today:{{ app_class_name }}AiTodayTransformer
    ### puts the best sections of docs/knowledge in front of the question, with
    ### sources (project example of a small RAG, core/ai/transformers/retrieve.py)
    retrieve:
      type: {{ app_label }}.core.ai.transformers.retrieve:{{ app_class_name }}AiRetrieveTransformer
      options:
        base_dir: docs/knowledge
        top_k: 3

  ### conductors steer the run (order, redirect, drive). same item form as
  ### guards; no built-in type yet, so "type" is a class path
  conductors:
    ### adds a call of "current" to the first model answer (project example,
    ### core/ai/conductors/today.py)
    today_call:
      type: {{ app_label }}.core.ai.conductors.today:{{ app_class_name }}AiTodayConductor

  ### sandboxes contain a tool's execution. an agent lists a chain; a tool runs
  ### in the first sandbox whose "tools" contain it, else the call is denied.
  ### each type offers only the limits it can enforce; all options, defaults
  ### and what each type enforces: CONFIG.md of tokeo-fundi, section 5
  sandboxes:
    ### zero isolation, in-process; only trusted, quick tools, named one by one
    ### or by group (there is no catch-all, a new tool runs nowhere until named)
    allow:
      type: in_process
      tools:
        - calendar
        - filesystem
        - mathematics
        - answer42
        - knowledge
      # options:
      #   max_output_mb: 1     # stdout and stderr kept, larger values fail
    ### crash and resource isolation in a subprocess (timeout + optional memory
    ### limit); not a jail against hostile code
    jailed:
      type: subprocess
      tools:
        - mathematics
      options:
        timeout: 10            # wall-clock seconds, then SIGKILL
        # max_memory_mb: 256   # rlimit (linux; macos rejects small limits)
        cwd: tmp/sandbox
        # max_output_mb: 1     # stdout and stderr kept, larger values fail
    ### real isolation for model code: a wasm guest, hard memory limit, no network.
    ### opt-in: needs the extra tokeo-fundi[wasm] (feature_ai_wasm) and a
    ### built python.wasm (core/ai/sandboxes/WASM.md of tokeo-fundi)
    coded:
      type: tokeo.core.ai.sandboxes:TokeoAiWasmSandbox
      tools:
        - coding
      options:
        runtime: ./wasm/python.wasm
        stdlib: ./wasm/lib/python3.13
        max_memory_mb: 256
        timeout: 10
        # max_disk_mb: 64      # MB the guest may write, its output included
        # watch_interval: 1.0  # seconds between the disk and file checks
        # max_output_mb: 1     # stdout and stderr kept, larger values fail

{% if feature_ai_docker == "Y" %}
    ### a hardened, throwaway container of the app's own image (make docker):
    ### no network, read-only, no capabilities, a user that is not root.
    ### whoever may use docker is root on the host in effect: never mount the
    ### docker socket into a container of the app
    docked:
      type: docker
      tools:
        - mathematics
      options:
        image: {{ app_label }}:latest
        max_memory_mb: 256
        timeout: 20
        # command: podman      # rootless instead of docker
        # reuse: true          # one container for the process, not per call
        # max_disk_mb: 64      # size of the tmpfs /tmp
        # max_output_mb: 1     # stdout and stderr kept, larger values fail

{% endif %}
  ### agents are the composition root: they bind tools, governors and the sandbox
  ### chain and set the limits. the model is bound late via the profile. an item:
  ### "type" ("fundi" or a class path), options under "options"
  agents:
    ### default agent (defaults.agent): governs nothing, audits everything
    audited:
      type: fundi
      options:
        ### the governor pipeline, in order (guards/transformers/conductors)
        governors:
          - trace_audit
        sandboxes:
          - allow
        ### other options an agent may take:
        # tools: [mathematics]          # tools this agent contributes
        # deny: [append_file]           # hard ban, before any sandbox lookup
        # max_steps: 0                  # override the base limits for this agent
        # max_loops: 3

    ### guarded project tools: read/calc/time yes, write denied; results
    ### redacted and truncated, every outcome audited. calc runs jailed.
    ###   {{ app_label }} ai ask "append_file hello" --agent guarded   # asks you
    guarded:
      type: fundi
      options:
        tools:
          - mathematics
          - calendar
          - filesystem
        governors:
          - readonly
          - ask_write: [on_call]
          - tool_schema_validate
          - regex_redact
          - truncate
          - trace_audit
        sandboxes:
          - jailed
          - allow

{% if feature_ai_docker == "Y" %}
    ### calc in a docker container (needs docker and the image: make docker).
    ###   {{ app_label }} ai ask "calc 2 + 3" --agent contained
    contained:
      type: fundi
      options:
        tools:
          - mathematics
        governors:
          - tool_schema_validate
          - trace_audit
        sandboxes:
          - docked

{% endif %}
    ### runs model-written code in the wasm guest (opt-in, needs ./wasm).
    ###   {{ app_label }} ai ask "text reverse otto" --agent coder
    coder:
      type: fundi
      options:
        tools:
          - coding
        governors:
          - trace_audit
        sandboxes:
          - coded

    ### showcase: the truncate transformer at on_close only ("[stages]" stage list).
    ###   {{ app_label }} ai ask "tell me a longer story" --agent showcase
    showcase:
      type: fundi
      options:
        tools:
          - mathematics
          - calendar
        governors:
          - truncate: [on_close]
          - trace_audit
        sandboxes:
          - allow

    ### calendar with the real date: today_prompt puts it in the prompt,
    ### today_call adds a call of current to the first answer.
    ###   {{ app_label }} ai ask "welcher tag ist heute" --agent dated
    dated:
      type: fundi
      options:
        tools:
          - calendar
        governors:
          - today_prompt
          - today_call
          - trace_audit
        sandboxes:
          - allow

    ### writing with a word filter and a person to confirm. answer no_retry
    ### with the note "deny: world" and the filter judges the call anew.
    ###   {{ app_label }} ai ask "append_file hello world" --agent careful
    careful:
      type: fundi
      options:
        tools:
          - filesystem
        governors:
          - words
          - ask_write: [on_call]
          - trace_audit
        sandboxes:
          - allow

    ### a small RAG: retrieve puts the fitting sections of docs/knowledge in
    ### front of the question (see them with --trace), search_docs lets the
    ### model look them up itself, through redact and truncate.
    ###   {{ app_label }} ai ask "how many vacation days do I get" --agent informed --trace
    ###   {{ app_label }} ai ask "search_docs hotel per night" --agent informed
    informed:
      type: fundi
      options:
        tools:
          - knowledge
        governors:
          - retrieve
          - regex_redact
          - truncate
          - trace_audit
        sandboxes:
          - allow

    ### house-tool demo: offers only answer42 (always returns 42).
    ###   {{ app_label }} ai ask "divide 5 by 2 with our tool" --agent answer42
    answer42:
      type: fundi
      options:
        tools:
          - answer42
        governors:
          - trace_audit
        sandboxes:
          - allow

  ### profiles bind the model. an item: "type" is a provider alias or a
  ### class path, "model" the model, "agent" the agent; the connection of the
  ### provider under "options"
  profiles:
    ### the built-in local mock: deterministic, no server (calls a tool when the
    ### first prompt word names one).
    ###   {{ app_label }} ai ask "calc 2 + 3" --agent guarded
    mock:
      type: mock
      purpose: mocking
      agent: guarded

{% if feature_ai_akili == "Y" %}
    ### the project's own trained akili micro model (in {{ app_label }}/core/akili):
    ### plans real tool chains in-process, no server. train once with the
    ### akili extra, then ask (AKILI-USE.md walks the demos):
    ###   pip install -e .[akili]
    ###   python -m {{ app_label }}.core.akili.train
    ###   {{ app_label }} ai ask "wochentag von heute plus 14 tage" --profile akili
    akili:
      type: {{ app_label }}.core.ai.providers.akili:TokeoAiAkiliProvider
      purpose: calendar
      ### shares the guarded agent but denies the tools it does not need
      agent: guarded
      deny:
        - mathematics
        - filesystem
{% endif %}

    ### mock against the coder agent: synthesizes python that runs in wasm.
    ###   {{ app_label }} ai ask "text upper der wochentag von heute" --profile codermock
    codermock:
      type: mock
      purpose: codeact
      agent: coder

    ### an OpenAI-compatible server you run yourself (ollama, vllm, llama.cpp,
    ### mlx). set <modelname> to the id your server exposes.
    ###   {{ app_label }} ai ask "hauptstadt von frankreich" --profile assistant
    assistant:
      type: oai_compat
      model: "<modelname>"
      options:
        base_url: http://localhost:8000/v1
        # key: ${OPENAI_API_KEY}     # env/vault resolution; never clear text
        # timeout: 120
      ### passed unchecked to the endpoint; per call --model_param key=value
      ### (see tokeo CONFIG.md section 8)
      ### common keys:
      ###   temperature      randomness/creativity, ~0.0-2.0 (lower = focused)
      ###   top_p            nucleus sampling cutoff, 0.0-1.0
      ###   max_tokens       max length of the generated answer
      ###   frequency_penalty / presence_penalty   damp repetition, ~-2.0-2.0
      ###   stop             string or list that ends generation
      ###   seed             fixed value for (mostly) reproducible output
      ###   response_format  e.g. {type: json_object} for structured output
      ###   tool_choice      auto/none/required, or a named function
      # model_params:
      #   temperature: 0.2
      #   top_p: 0.9
      #   max_tokens: 1024
      purpose: assistant
      agent: guarded
