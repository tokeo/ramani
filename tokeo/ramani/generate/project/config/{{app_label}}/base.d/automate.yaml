### **The {{ app_name }} Automate Configuration**
###
### - The config is merged into the app config.
---



### ### Automation Tasks Configuration
###
### Config for automation tasks that can be run on-demand
automate:
  ### list of hosts reference
  hosts:
    local:
      ### define shell for local tasks
      shell: /bin/sh
  ### named groups of hosts, a task names a group in its hosts
  # hostgroups:
  #   web:
  #     - web1
  #     - web2
  ### named connections, a host or task takes one by "use"; _defaults hold
  ### the options of all connections
  # connections:
  #   _defaults:
  #     connect_timeout: 60
  #     port: 22
  #     user: null
  #     password: null
  #     key_path: null
  #     known_hosts: null
  ### list of tasks
  tasks:
    ### optional default options
    _defaults:
      ### default module for tasks implementations
      module: {{ app_label }}.core.tasks.automate
      ### ensure non overwritable keywords when calling shell commands
      ### options: strict | append | null
      protect: null
      ### sanitize values and keys before calling shell commands
      sanitize: true
    ### simplest ```count_words``` task configuration by just an empty dict
    count_words: {}
    ### ```uname``` task configuration with arguments config
    uname:
      kwargs:
        flags:
          - '-a'
